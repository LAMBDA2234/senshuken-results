<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>District Senshuken — Results Hub</title>
  <style>
    :root{
      --bg:#05060a; --neon1:#00e5ff; --neon2:#7c3aed;
      --glass: rgba(255,255,255,0.06);
      font-family: Inter, system-ui;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#e6f2ff}
    .wrap{max-width:1100px;margin:20px auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center}
    .card{background:rgba(255,255,255,0.02);border:1px solid var(--glass);
      padding:20px;border-radius:12px;margin-top:20px}
    input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--glass);
      background:rgba(255,255,255,0.04);color:#e6f2ff;margin-bottom:10px}
    button{padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:600}
    .btn{background:linear-gradient(90deg,var(--neon1),var(--neon2));color:#00121a}
    .btn-ghost{background:transparent;border:1px solid var(--glass);color:#e6f2ff}
    .list{margin-top:20px;display:flex;flex-direction:column;gap:10px}
    .entry{border:1px solid var(--glass);padding:12px;border-radius:10px;
      background:rgba(255,255,255,0.02);display:flex;justify-content:space-between}
    .badge{padding:6px 10px;border-radius:20px;font-weight:700}
    .medal-Gold{background:#ffd966;color:#1b1100}
    .medal-Silver{background:#e6e8ee;color:#08101a}
    .medal-Bronze{background:#e6ad7a;color:#2b1305}
    .medal-None{background:transparent;border:1px dashed var(--glass);color:#e6f2ff}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>District Senshuken — Results Hub</h1>
    <button id="exportBtn" class="btn-ghost">Export CSV</button>
  </header>

  <section class="card">
    <h3>Add Participant</h3>
    <form id="addForm">
      <input id="name" type="text" placeholder="Name" required>
      <input id="age_group" type="text" placeholder="Age group">
      <select id="gender"><option value="">Gender</option><option>Male</option><option>Female</option></select>
      <select id="event"><option>Kata</option><option>Kumite</option><option>Team</option></select>
      <select id="medal"><option>None</option><option>Gold</option><option>Silver</option><option>Bronze</option></select>
      <textarea id="remarks" placeholder="Remarks"></textarea>
      <button class="btn" type="submit">Save</button>
      <button class="btn-ghost" type="button" id="refreshBtn">Refresh</button>
    </form>
    <div>Status: <span id="status">Not connected</span></div>
  </section>

  <section class="card">
    <h3>Entries</h3>
    <input id="search" type="text" placeholder="Search">
    <select id="filterEvent"><option value="All">All</option><option>Kata</option><option>Kumite</option><option>Team</option></select>

    <div class="list" id="list"></div>

    <h3>Medal Tally</h3>
    <div id="tally" style="display:flex;gap:12px;"></div>
  </section>
</div>

<script>
  const API_BASE = "https://script.google.com/macros/s/AKfycbyjEP2gOWhDbY97EYBKJZgn2qnl-vlh6NB5mAjvnu-Ht3qrKoESxkMD8divCEsqZsqVRg/exec";

  const ADMIN_PASS = "senshuken123";
  let ADMIN = false;
  window.onload = ()=>{
    const p = prompt("Admin password (blank = view only):");
    if(p === ADMIN_PASS){ ADMIN = true; alert("Admin mode ON"); }
  }

  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");
  const tallyEl = document.getElementById("tally");

  function setStatus(s){ statusEl.textContent = s }

  async function fetchEntries(){
    try{
      setStatus("Loading...");
      const res = await fetch(API_BASE);
      const data = await res.json();
      renderList(data);
      setStatus("Connected");
    }catch(e){ setStatus("Error: "+e); }
  }

  function renderList(items){
    const q = document.getElementById("search").value.toLowerCase();
    const f = document.getElementById("filterEvent").value;

    const filtered = items.filter(x=>{
      if(f !== "All" && x.event !== f) return false;
      if(q && !(x.name.toLowerCase().includes(q) || (x.remarks||"").toLowerCase().includes(q))) return false;
      return true;
    });

    listEl.innerHTML = "";
    filtered.forEach(x=>{
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `
        <div>
          <div><b>${x.name}</b></div>
          <div>${x.age_group||'-'} · ${x.gender||'-'} · ${x.event}</div>
          <div>${x.remarks||''}</div>
        </div>
        <div style="text-align:right;">
          <div class="badge medal-${x.medal}">${x.medal}</div>
          <div style="font-size:12px;opacity:0.6;">${x.created_at}</div>
        </div>
      `;
      listEl.appendChild(div);
    });

    const tally = {Gold:0,Silver:0,Bronze:0,None:0};
    items.forEach(x=> tally[x.medal]++ );
    tallyEl.innerHTML = Object.entries(tally)
      .map(([k,v])=> `<div class="badge medal-${k}">${k}: ${v}</div>`)
      .join("");
  }

  document.getElementById("addForm").onsubmit = async(e)=>{
    e.preventDefault();
    if(!ADMIN) return alert("Admin only");

    const payload = {
      name: name.value.trim(),
      age_group: age_group.value.trim(),
      gender: gender.value,
      event: event.value,
      medal: medal.value,
      remarks: remarks.value.trim()
    };

    try{
      setStatus("Saving...");
      await fetch(API_BASE,{
        method:"POST",
        body: JSON.stringify(payload)
      });
      setStatus("Saved");
      e.target.reset();
      fetchEntries();
    }catch(err){ alert("Error: "+err); }
  }

  search.oninput = fetchEntries;
  filterEvent.onchange = fetchEntries;
  refreshBtn.onclick = fetchEntries;

  async function exportCSV(){
    const res = await fetch(API_BASE);
    const data = await res.json();
    const rows = ["Name,Age Group,Gender,Event,Medal,Remarks,Created At"];
    data.forEach(r=>{
      rows.push(`${r.name},${r.age_group},${r.gender},${r.event},${r.medal},${(r.remarks||"").replace(/,/g," ")},${r.created_at}`);
    });
    const blob = new Blob([rows.join("
")],{type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="participants.csv"; a.click();
  }
  exportBtn.onclick = export
